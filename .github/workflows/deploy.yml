name: deploy

# Apply only from main, only by hand, only after a reviewer approves the 'dev' environment.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'apply' to deploy the landing zone to dev"
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"

jobs:
  apply:
    name: Plan and apply (dev)
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'apply'
    runs-on: ubuntu-latest
    environment: dev # configure required reviewers on this environment in repo settings
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_owner: ${{ vars.LZ_OWNER }}
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=landing-zone/dev.tfstate"
      - name: terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: terraform apply (saved plan only)
        run: terraform apply -input=false -lock-timeout=5m tfplan
